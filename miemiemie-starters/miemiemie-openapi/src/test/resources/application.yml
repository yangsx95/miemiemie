springdoc:
  api-docs:
    enabled: true
    groups:
      enabled: true
  group-configs:
    - display-name: "hello"
      group: "hello"
      paths-to-match:
        - "/**"
  swagger-ui:
    disable-swagger-default-url: true

miemiemie:
  web:
    result-package-white-list:
      - /v3/api-docs/**